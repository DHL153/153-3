<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미소녀 수박게임 + RPG 에디션</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', 'Segoe UI', sans-serif; touch-action: none; }
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #a0c4ff 0%, #c3aed6 50%, #ffcbf2 100%);
            display: flex; justify-content: center; align-items: center; 
            height: 100dvh; width: 100vw; overflow: hidden;
            color: #4a4e69; 
        }
        #app {
            width: 100%; max-width: 420px; height: 100dvh; 
            background: rgba(255, 255, 255, 0.95); position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(185, 160, 230, 0.4); overflow: hidden;
        }
        @media (min-width: 421px) {
            #app { height: 95vh; border: 4px solid #b9a0e6; border-radius: 16px; }
        }

        /* ================= [ 상단 프로필/상태/설정 바 ] ================= */
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: #fff; border-bottom: 2px solid #e8dff5; flex-shrink: 0; z-index: 20;
        }
        .profile-pic { 
            width: 32px; height: 32px; background: #e8dff5; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 18px; border: 2px solid #b9a0e6; 
        }
        .top-stats { display: flex; gap: 10px; }
        .stat-badge { 
            background: #fdfbf7; padding: 4px 10px; border-radius: 12px; 
            font-size: 13px; font-weight: bold; border: 1px solid #e8dff5; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        #energy-badge { flex-direction: column; gap: 2px; min-width: 90px; min-height: 42px; justify-content: center; }
        #recharge-info {
            font-size: 10px; color: #d81b60; font-weight: bold; text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            visibility: hidden; 
        }
        .settings-btn { font-size: 20px; cursor: pointer; }

        /* ================= [ SPA 뷰 컨테이너 구조 ] ================= */
        #main-content {
            flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden;
        }
        .view-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; background: #fdfbf7; overflow-y: auto; touch-action: auto;
        }
        .view-container.active { display: flex; }
        #view-home { background: transparent; overflow: hidden; touch-action: none; }

        /* ================= [ 뷰 1: 홈 (게임 전투 씬) ] ================= */
        /* 💡 전투 구역의 높이를 기존 100px -> 145px 로 확대 */
        #board-section {
            flex-shrink: 0; height: 145px; background: #e8dff5; position: relative; border-bottom: 4px solid #b9a0e6;
            display: flex; justify-content: center; align-items: center; padding: 5px 10px; z-index: 10;
        }
        
        /* 💡 전투 배경 화면 높이 90px -> 135px (1.5배) 확대, 배경 패턴 비율도 1.5배 조정 */
        #battle-stage {
            width: 100%; height: 135px; background-color: #f1e9fb;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.7) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.7) 75%, transparent 75%, transparent),
                linear-gradient(to top, #b9a0e6 0%, #b9a0e6 22px, transparent 22px);
            background-size: 90px 100%, 100% 100%; border: 3px solid #b9a0e6; border-radius: 12px; position: relative; overflow: hidden;
            animation: scrollBg 1.5s linear infinite;
        }
        @keyframes scrollBg { from { background-position: 0 0, 0 0; } to { background-position: -90px 0, 0 0; } }

        /* 💡 캐릭터 폰트 크기 65px 유지, 바닥으로 떨어지지 않게 top 좌표 45px로 조절 */
        .character { position: absolute; font-size: 65px; top: 45px; line-height: 1; transition: all 0.2s ease-out; }
        .hero { left: 35%; margin-left: -32px; transform: scaleX(-1); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
        
        .hero.attack { transform: scaleX(-1) translateX(-60px) rotate(-20deg) scale(1.2); }
        
        .enemy { right: -80px; opacity: 0; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
        .enemy.slide-in { right: 15%; opacity: 1; }
        .enemy.explode { right: 15%; animation: explodeAnim 0.4s forwards ease-out; }
        
        @keyframes explodeAnim { 
            0% { transform: scale(1); opacity: 1; filter: brightness(1); } 
            50% { transform: scale(1.4) rotate(-15deg); opacity: 0.8; filter: brightness(1.5) drop-shadow(0 0 15px #ff4757); } 
            100% { transform: scale(2) rotate(15deg); opacity: 0; filter: blur(4px); } 
        }

        #game-section {
            flex: 1; background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(220, 240, 255, 0.6));
            position: relative; overflow: hidden; cursor: crosshair;
        }
        #game-section canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #preview-ball { position: absolute; top: 20px; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; opacity: 0.9; display: none; }
        #drop-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(185, 160, 230, 0.3); border-left: 2px dashed #b9a0e6; pointer-events: none; display: none; z-index: 5; transform: translateX(-50%); }
        #deadline-line { position: absolute; top: 45px; left: 0; right: 0; height: 2px; background: rgba(255, 112, 166, 0.2); border-bottom: 2px dashed #ff70a6; z-index: 4; pointer-events: none; }
        
        #warning-banner {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%); background: #ff477e; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 2px solid white; box-shadow: 0 4px 10px rgba(255, 71, 126, 0.4); display: none; z-index: 10; animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.05); } }

        /* ================= [ 게임 하단 UI (버튼 5개) ] ================= */
        #ui-section {
            flex-shrink: 0; background: #ffb3c6; padding: 8px 12px; display: flex; flex-direction: column; border-top: 4px solid #b9a0e6; z-index: 10;
        }
        
        .item-group { display: flex; justify-content: space-between; align-items: stretch; gap: 6px; }
        
        .btn-item {
            flex: 1; padding: 5px 0; border: 2px solid #fff; border-radius: 10px; font-size: 11px; font-weight: 800; color: #4a4e69; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all 0.1s; text-shadow: none;
        }
        .btn-item:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
        .btn-item span.icon-main { font-size: 16px; margin-bottom: 2px; display: block; text-shadow: none; }
        
        .cost-label { font-size: 10px; color: #d81b60; margin-top: 2px; font-weight: 800; text-shadow: none;}

        .btn-mult { background: #d1c4e9; box-shadow: 0 4px 0 #9575cd; justify-content: center; }
        .btn-hammer { background: #82ccdd; box-shadow: 0 4px 0 #60a3bc; } 
        .btn-shake { background: #f6e58d; box-shadow: 0 4px 0 #f4d03f; } 
        .btn-tilt { background: #b8e994; box-shadow: 0 4px 0 #78e08f; } 
        .btn-tilt.active { background: #78e08f; box-shadow: 0 0 0 transparent; transform: translateY(4px); color: #fff;}
        .btn-auto { flex: 1.2; background: #fff; box-shadow: 0 4px 0 #b2bec3; border: 2px solid #b9a0e6; transform: scale(1.05); margin: 0 2px;}
        .btn-auto.active { background: #4fc3f7; color: white; box-shadow: 0 0 0 transparent; border-color:#fff; transform: scale(1.05) translateY(4px); }


        /* ================= [ 제네릭 뷰 스타일 (캐릭터, 상점 등) ] ================= */
        .view-title { background: #b9a0e6; color: white; text-align: center; padding: 15px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(185, 160, 230, 0.4); flex-shrink: 0; }
        .view-content { padding: 20px; text-align: center; flex: 1; }

        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; padding-bottom: 20px; }
        .char-item { background: white; border: 2px solid #e8dff5; border-radius: 12px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 #e8dff5; }
        .char-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .char-item .char-lv { font-size: 12px; font-weight: bold; color: #4a4e69; }

        /* ================= [ 공통 하단 네비게이션 바 ] ================= */
        #bottom-nav {
            flex-shrink: 0; height: 60px; background: #fff; border-top: 2px solid #e8dff5;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; height: 100%; color: #b2bec3; font-size: 11px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .nav-item .icon { font-size: 22px; margin-bottom: 2px; transition: transform 0.2s; filter: grayscale(1); opacity: 0.6; }
        .nav-item.active { color: #d81b60; }
        .nav-item.active .icon { transform: translateY(-3px) scale(1.1); filter: grayscale(0); opacity: 1; }

        .floating-text {
            position: absolute; font-weight: bold; font-size: 18px; color: #fff; 
            text-shadow: -1px -1px 0 #4a4e69, 1px -1px 0 #4a4e69, -1px 1px 0 #4a4e69, 1px 1px 0 #4a4e69; pointer-events: none; z-index: 100; animation: floatUp 1s forwards ease-out; white-space: nowrap; text-align: center;
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.3); } }
        
        .overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.85); color: #4a4e69; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 2000; display: none; backdrop-filter: blur(5px); }
        .action-btn { margin-top:20px; padding: 12px 24px; font-size:16px; border-radius:12px; border:2px solid #fff; background:#ffb3c6; color:white; font-weight:bold; cursor:pointer; box-shadow: 0 4px 0 #f78fb3; transition: all 0.1s; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 고정 상태바 (에너지/골드/설정) -->
    <div id="top-bar">
        <div class="profile-pic">👩</div>
        <div class="top-stats">
            <div class="stat-badge" id="energy-badge">
                <div>⚡ <span id="val-energy">50 / 50</span></div>
                <div id="recharge-info">⏳ 15s (+10)</div>
            </div>
            <div class="stat-badge">💰<span id="val-gold">0</span></div>
        </div>
        <div class="settings-btn">⚙️</div>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div id="main-content">
        <!-- 뷰 1: 홈 (게임 메인) -->
        <div id="view-home" class="view-container active">
            
            <!-- 전투 배경(Stage) 1.5배 확대 뷰 -->
            <div id="board-section">
                <div id="battle-stage">
                    <div id="hero" class="character hero">🤺</div>
                    <div id="enemy" class="character enemy">🦇</div>
                </div>
            </div>

            <div id="game-section">
                <div id="deadline-line"></div>
                <div id="warning-banner">⚠️ 위험! 5.0초</div>
                <div id="drop-line"></div>
                <img id="preview-ball" src="" alt="preview">
            </div>

            <div id="ui-section">                
                <div class="item-group">
                    <button class="btn-item btn-mult" id="btn-mult" onclick="toggleMultiplier()">
                        <span class="icon-main" id="mult-label">x1</span><div style="font-size:10px">배수</div>
                    </button>
                    
                    <button class="btn-item btn-hammer" onclick="useItem('hammer')">
                        <span class="icon-main">🔨</span>망치
                        <div class="cost-label">⚡ 10</div>
                    </button>
                    
                    <button class="btn-item btn-auto" id="btn-auto" onclick="toggleAutoDrop()">
                        <span class="icon-main" style="font-size: 20px; margin-top:-2px;">🤖</span><div id="auto-label">오토: OFF</div>
                    </button>
                    
                    <button class="btn-item btn-shake" onclick="useItem('shake')">
                        <span class="icon-main">🌪️</span>쉐이크
                        <div class="cost-label">⚡ 10</div>
                    </button>
                    
                    <button class="btn-item btn-tilt" id="btn-tilt" onclick="useItem('tilt')">
                        <span class="icon-main">📱</span>
                        <div id="tilt-label">자이로</div>
                        <div id="tilt-timer" style="display:none; color:#fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.4);">10.0s</div>
                        <div class="cost-label" id="tilt-cost">⚡ 10</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- 뷰 2: 캐릭터 도감 -->
        <div id="view-character" class="view-container">
            <div class="view-title">도감 - 전체 캐릭터 (12종)</div>
            <div class="view-content">
                <div style="color: #8e7cc3; font-weight: bold; margin-bottom: 10px;">합성을 통해 모든 캐릭터를 수집해 보세요!</div>
                <div class="char-grid" id="char-grid-container"></div>
            </div>
        </div>

        <!-- 뷰 3: 상점 -->
        <div id="view-shop" class="view-container">
            <div class="view-title">상점</div>
            <div class="view-content" style="display:flex; justify-content:center; align-items:center; height:100%;">
                <div style="font-size: 20px; font-weight: bold; color: #b2bec3;">🛒<br>상점 준비중입니다.</div>
            </div>
        </div>

        <!-- 뷰 4: 마이룸 -->
        <div id="view-myroom" class="view-container">
            <div class="view-title">마이룸</div>
            <div class="view-content" style="display:flex; justify-content:center; align-items:center; height:100%;">
                <div style="font-size: 20px; font-weight: bold; color: #b2bec3;">🛋️<br>마이룸 준비중입니다.</div>
            </div>
        </div>

        <!-- 뷰 5: 앨범 -->
        <div id="view-album" class="view-container">
            <div class="view-title">앨범</div>
            <div class="view-content" style="display:flex; justify-content:center; align-items:center; height:100%;">
                <div style="font-size: 20px; font-weight: bold; color: #b2bec3;">📖<br>앨범 준비중입니다.</div>
            </div>
        </div>
    </div>

    <!-- 하단 공통 네비게이션 바 -->
    <div id="bottom-nav">
        <div class="nav-item" id="nav-shop" onclick="switchMenu('shop')">
            <div class="icon">🛒</div><div>상점</div>
        </div>
        <div class="nav-item" id="nav-character" onclick="switchMenu('character')">
            <div class="icon">🐾</div><div>캐릭터</div>
        </div>
        <div class="nav-item active" id="nav-home" onclick="switchMenu('home')">
            <div class="icon">🏠</div><div>홈</div>
        </div>
        <div class="nav-item" id="nav-myroom" onclick="switchMenu('myroom')">
            <div class="icon">🛋️</div><div>마이룸</div>
        </div>
        <div class="nav-item" id="nav-album" onclick="switchMenu('album')">
            <div class="icon">📖</div><div>앨범</div>
        </div>
    </div>

    <div id="overlay-gameover" class="overlay">
        <div style="font-size: 32px; font-weight: bold; margin-bottom: 10px; color:#d81b60;">GAME OVER</div>
        <div style="font-size: 16px; margin-bottom: 10px;">데드라인을 초과했습니다!</div>
        <button class="action-btn" onclick="restartGame()">다시 시작</button>
    </div>
</div>

<script>
    // 전역 상태 변수
    let energy = 50; 
    let gold = 0;
    let multiplier = 1;
    let energyCostBase = 1; 
    let itemCost = 10; 
    let currentMenu = 'home';

    const DEADLINE_Y = 45; 
    let isGameOver = false;
    let isWarning = false;
    let warningTimeRemaining = 5.0;
    let warningInterval = null;

    let energyRechargeInterval = null;
    let energyTimeRemaining = 15;

    let isTiltActive = false;
    let tiltInterval = null;
    let isAutoDrop = false;
    let autoDropTimer = null;
    let isBattling = false;

    // 배수 버튼 순환 로직
    const multList = [1, 2, 5, 10];
    let multIndex = 0;

    const uiEnergy = document.getElementById('val-energy');
    const uiGold = document.getElementById('val-gold');
    const overlayGameOver = document.getElementById('overlay-gameover');
    const warningBanner = document.getElementById('warning-banner');

    // 구슬 크기 약 15% 축소
    const baseImgSize = 256;
    const LEVELS = [
        { radius: 12, img: 'images/lv01.png' }, { radius: 18, img: 'images/lv02.png' },
        { radius: 25, img: 'images/lv03.png' }, { radius: 33, img: 'images/lv04.png' },
        { radius: 42, img: 'images/lv05.png' }, { radius: 52, img: 'images/lv06.png' },
        { radius: 62, img: 'images/lv07.png' }, { radius: 75, img: 'images/lv08.png' },
        { radius: 90, img: 'images/lv09.png' }, { radius: 108, img: 'images/lv10.png' },
        { radius: 125, img: 'images/lv11.png' }, { radius: 145, img: 'images/lv12.png' }
    ].map(level => { level.scale = (level.radius * 2) / baseImgSize; return level; });

    function updateEnergyUI() {
        uiEnergy.innerText = energy + " / 50";
    }
    updateEnergyUI(); 

    window.toggleMultiplier = function() {
        multIndex = (multIndex + 1) % multList.length;
        multiplier = multList[multIndex];
        document.getElementById('mult-label').innerText = 'x' + multiplier;
        
        const btn = document.getElementById('btn-mult');
        btn.style.transform = 'translateY(4px)';
        setTimeout(() => btn.style.transform = 'translateY(0)', 100);
        
        uiEnergy.parentElement.style.color = '#ff70a6'; 
        setTimeout(() => uiEnergy.parentElement.style.color = '', 200);
    }

    window.switchMenu = function(menuId) {
        currentMenu = menuId;
        document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + menuId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-' + menuId).classList.add('active');

        if (menuId === 'character') renderCharacterGrid();
    }

    function renderCharacterGrid() {
        const grid = document.getElementById('char-grid-container');
        grid.innerHTML = ''; 
        LEVELS.forEach((lv, index) => {
            const item = document.createElement('div');
            item.className = 'char-item';
            item.innerHTML = `
                <img src="${lv.img}" alt="Lv${index+1}">
                <div class="char-lv">Lv.${index + 1}</div>
            `;
            grid.appendChild(item);
        });
    }

    function showFloatingText(text, x, y, color = '#fff') {
        const el = document.createElement('div'); el.className = 'floating-text'; el.innerHTML = text;
        el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.color = color;
        document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
    }

    function triggerBattle() {
        if (isBattling) return; 
        isBattling = true;

        const enemies = ['🦇', '🦹‍♂️', '👾', '🧛', '🧟', '🐉', '🐲'];
        const heroEl = document.getElementById('hero');
        const enemyEl = document.getElementById('enemy');

        enemyEl.innerText = enemies[Math.floor(Math.random() * enemies.length)];
        enemyEl.className = 'character enemy slide-in';

        setTimeout(() => {
            heroEl.classList.add('attack');
            setTimeout(() => {
                heroEl.classList.remove('attack');
                enemyEl.className = 'character enemy explode';
                if (navigator.vibrate) navigator.vibrate([50, 100, 50]);

                const rand = Math.floor(Math.random() * 12);
                let rewardText = ""; let rewardColor = "#fff";
                const rect = enemyEl.getBoundingClientRect();

                if (rand < 4) { 
                    const amount = 100 * multiplier;
                    gold += amount; rewardText = `+${amount} 💰`; rewardColor = "#f6e58d"; 
                } else if (rand < 6) { 
                    const amount = 20 * multiplier;
                    gold -= amount; if (gold < 0) gold = 0; 
                    rewardText = `-${amount} 💰`; rewardColor = "#ff7675"; 
                } else if (rand < 8) { 
                    energy += 15; if (energy > 50) energy = 50;
                    rewardText = `+15 ⚡`; rewardColor = "#b9f6ca"; updateEnergyUI(); checkRecharge(); 
                } else { 
                    rewardText = `처치! ⚔️`; rewardColor = "#fff"; 
                }
                
                uiGold.innerText = gold; updateEnergyUI();
                showFloatingText(rewardText, rect.left - 20, rect.top + 20, rewardColor);
                setTimeout(() => { enemyEl.className = 'character enemy'; isBattling = false; }, 400);
            }, 150); 
        }, 200); 
    }

    function checkRecharge() {
        const info = document.getElementById('recharge-info');
        if (energy < 50 && !energyRechargeInterval) {
            info.style.visibility = 'visible';
            energyTimeRemaining = 15;
            info.innerText = `⏳ ${energyTimeRemaining}s (+10)`;
            
            energyRechargeInterval = setInterval(() => {
                energyTimeRemaining--;
                if (energyTimeRemaining <= 0) {
                    energy += 10;
                    if (energy > 50) energy = 50;
                    updateEnergyUI();
                    showFloatingText(`에너지 +10 ⚡`, window.innerWidth/2 - 40, window.innerHeight/2, '#1dd1a1');
                    
                    if (energy >= 50) {
                        clearInterval(energyRechargeInterval); energyRechargeInterval = null; info.style.visibility = 'hidden';
                    } else {
                        energyTimeRemaining = 15; info.innerText = `⏳ ${energyTimeRemaining}s (+10)`;
                    }
                } else {
                    info.innerText = `⏳ ${energyTimeRemaining}s (+10)`;
                }
            }, 1000);
        } else if (energy >= 50 && energyRechargeInterval) {
            clearInterval(energyRechargeInterval); energyRechargeInterval = null; info.style.visibility = 'hidden';
        }
    }

    function consumeEnergy(amount) {
        if (energy < amount && amount !== 100) { 
            showFloatingText("에너지가 없습니다.", window.innerWidth/2 - 60, window.innerHeight/2 + 20, "#ff7675"); 
            if (isAutoDrop) toggleAutoDrop();
            return false; 
        }
        energy -= amount; if (energy < 0) energy = 0; 
        updateEnergyUI(); checkRecharge(); return true;
    }

    window.onload = () => {
        const Engine = Matter.Engine, Render = Matter.Render, Runner = Matter.Runner, Bodies = Matter.Bodies, Composite = Matter.Composite, Events = Matter.Events;
        const gameSection = document.getElementById('game-section');
        const width = gameSection.clientWidth; const height = gameSection.clientHeight;

        const engine = Engine.create({ enableSleeping: false });
        const world = engine.world;
        
        const render = Render.create({
            element: gameSection, engine: engine,
            options: { width: width, height: height, wireframes: false, background: 'transparent', pixelRatio: window.devicePixelRatio }
        });

        Render.run(render); Runner.run(Runner.create(), engine);

        const wallOptions = { isStatic: true, render: { fillStyle: 'transparent' } };
        Composite.add(world, [
            Bodies.rectangle(width / 2, height + 25, width, 50, wallOptions),
            Bodies.rectangle(-25, 0, 50, height * 5, wallOptions),
            Bodies.rectangle(width + 25, 0, 50, height * 5, wallOptions),
            Bodies.rectangle(width / 2, -800, width * 2, 100, wallOptions)
        ]);

        window.addEventListener('deviceorientation', (event) => {
            let gamma = event.gamma || 0; let beta = event.beta || 0;

            if (!isTiltActive && !isAutoDrop) return;
            if (currentMenu !== 'home') return; 
            
            let adjustedBeta = beta - 45; 
            const maxForce = 3; const sensitivity = 30;
            let forceX = (gamma / sensitivity) * maxForce;
            let forceY = (adjustedBeta / sensitivity) * maxForce;

            engine.gravity.x = Math.max(-maxForce, Math.min(maxForce, forceX));
            engine.gravity.y = Math.max(-maxForce, Math.min(maxForce, 1 + forceY)); 
        });

        window.activateTiltTimer = function() {
            isTiltActive = true;
            const tiltBtn = document.getElementById('btn-tilt');
            tiltBtn.classList.add('active'); 
            document.getElementById('tilt-label').style.display = 'none'; 
            document.getElementById('tilt-cost').style.display = 'none'; 
            document.getElementById('tilt-timer').style.display = 'block';
            showFloatingText(`기기를 기울이세요! 📱`, window.innerWidth/2 - 65, window.innerHeight/2);
            
            tiltTimeRemaining = 10.0; document.getElementById('tilt-timer').innerText = tiltTimeRemaining.toFixed(1) + 's';

            tiltInterval = setInterval(() => {
                tiltTimeRemaining -= 0.1;
                if (tiltTimeRemaining <= 0) {
                    clearInterval(tiltInterval); isTiltActive = false; 
                    if (!isAutoDrop) { engine.gravity.x = 0; engine.gravity.y = 1; }
                    tiltBtn.classList.remove('active'); 
                    document.getElementById('tilt-label').style.display = 'block'; 
                    document.getElementById('tilt-cost').style.display = 'block'; 
                    document.getElementById('tilt-timer').style.display = 'none';
                } else { document.getElementById('tilt-timer').innerText = tiltTimeRemaining.toFixed(1) + 's'; }
            }, 100);
        }

        Events.on(engine, 'afterUpdate', () => {
            if (isGameOver) return;
            const bodies = Composite.allBodies(world).filter(b => b.level !== undefined && !b.isStatic);
            let isOverflow = false; const now = Date.now();
            for (let b of bodies) {
                if (now - b.spawnTime > 1000 && b.position.y - LEVELS[b.level].radius <= DEADLINE_Y && Math.abs(b.velocity.y) < 0.3) { isOverflow = true; break; }
            }

            if (isOverflow && !isWarning) {
                isWarning = true; warningTimeRemaining = 5.0; warningBanner.style.display = 'block';
                warningInterval = setInterval(() => {
                    warningTimeRemaining -= 0.1; warningBanner.innerText = `⚠️ 위험! ${Math.max(0, warningTimeRemaining).toFixed(1)}초`;
                    if (warningTimeRemaining <= 0) { clearInterval(warningInterval); triggerGameOver(); }
                }, 100);
            } else if (!isOverflow && isWarning) { isWarning = false; clearInterval(warningInterval); warningBanner.style.display = 'none'; }
        });

        function triggerGameOver() {
            isGameOver = true; isWarning = false; warningBanner.style.display = 'none';
            if(isAutoDrop) toggleAutoDrop(); overlayGameOver.style.display = 'flex';
        }

        window.restartGame = function() {
            overlayGameOver.style.display = 'none';
            const bodies = Composite.allBodies(world).filter(b => b.level !== undefined); Composite.remove(world, bodies);
            isGameOver = false; isTiltActive = false; engine.gravity.x = 0; engine.gravity.y = 1;
            document.getElementById('btn-tilt').classList.remove('active'); 
            document.getElementById('tilt-label').style.display = 'block'; 
            document.getElementById('tilt-cost').style.display = 'block'; 
            document.getElementById('tilt-timer').style.display = 'none';
            
            energy = 50; updateEnergyUI(); checkRecharge(); updatePreview();
        };

        window.useItem = function(itemType) {
            if (isGameOver || currentMenu !== 'home') return;
            if (itemType === 'tilt' && isTiltActive) { showFloatingText(`이미 작동 중! ⏳`, window.innerWidth/2 - 40, window.innerHeight/2); return; }
            if (!consumeEnergy(itemCost)) return; 
            
            const allBalls = Composite.allBodies(world).filter(b => b.level !== undefined);
            
            if (itemType === 'hammer') {
                if(allBalls.length > 0) {
                    const target = allBalls[Math.floor(Math.random() * allBalls.length)];
                    const reward = (target.level + 1) * 30;
                    gold += reward; uiGold.innerText = gold;
                    Composite.remove(world, target); 
                    showFloatingText(`뿅망치! +${reward}💰`, target.position.x, target.position.y, '#f6e58d');
                }
            } 
            else if (itemType === 'shake') {
                allBalls.forEach(b => {
                    const force = 0.12 * b.mass; Matter.Body.applyForce(b, b.position, { x: (Math.random() - 0.5) * force, y: -force * 1.8 });
                });
                showFloatingText(`쉐이크 🌪️`, window.innerWidth/2 - 30, window.innerHeight/2);
            } 
            else if (itemType === 'tilt') {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') { activateTiltTimer(); } 
                            else { 
                                showFloatingText(`권한 필요! 📱`, window.innerWidth/2 - 40, window.innerHeight/2, "#ff7675"); 
                                energy += itemCost; updateEnergyUI(); checkRecharge();
                            }
                        }).catch(console.error);
                } else { activateTiltTimer(); }
            }
        };

        const dropLine = document.getElementById('drop-line');
        const previewImg = document.getElementById('preview-ball');
        let nextDropLevel = Math.floor(Math.random() * 2);
        let canDrop = true;

        window.updatePreview = function() {
            const data = LEVELS[nextDropLevel]; previewImg.src = data.img; previewImg.style.width = (data.radius * 2) + 'px'; previewImg.style.height = (data.radius * 2) + 'px';
            if (!isAutoDrop && currentMenu === 'home') previewImg.style.display = 'block';
            else previewImg.style.display = 'none';
        }
        updatePreview();

        gameSection.addEventListener('pointermove', (e) => {
            if(isGameOver || isAutoDrop || !canDrop || currentMenu !== 'home') return;
            const rect = gameSection.getBoundingClientRect(); let xPos = e.clientX - rect.left;
            dropLine.style.display = 'block'; dropLine.style.left = xPos + 'px'; previewImg.style.left = xPos + 'px';
        });
        gameSection.addEventListener('pointerleave', () => { dropLine.style.display = 'none'; previewImg.style.left = '50%'; });

        function executeDrop(xPos) {
            if (!canDrop || isGameOver || currentMenu !== 'home') return;
            
            const currentCost = 1 * multiplier; 
            if (!consumeEnergy(currentCost)) return;

            const levelData = LEVELS[nextDropLevel];
            const startX = Math.min(Math.max(xPos, levelData.radius), width - levelData.radius);
            
            const body = Bodies.circle(startX, 20, levelData.radius, {
                restitution: 0.3, friction: 0.1, render: { sprite: { texture: levelData.img, xScale: levelData.scale, yScale: levelData.scale } }
            });
            body.level = nextDropLevel; body.isMerging = false; body.spawnTime = Date.now();
            Composite.add(world, body);

            canDrop = false; previewImg.style.display = 'none'; dropLine.style.display = 'none';
            setTimeout(() => { canDrop = true; nextDropLevel = Math.floor(Math.random() * 2); updatePreview(); }, 500);
        }

        gameSection.addEventListener('pointerdown', (e) => { if (isAutoDrop || currentMenu !== 'home') return; const rect = gameSection.getBoundingClientRect(); executeDrop(e.clientX - rect.left); });

        window.toggleAutoDrop = function() {
            const runToggle = () => {
                isAutoDrop = !isAutoDrop; const btnAuto = document.getElementById('btn-auto');
                if (isAutoDrop) {
                    btnAuto.classList.add('active'); document.getElementById('auto-label').innerText = '오토: ON'; previewImg.style.display = 'none'; dropLine.style.display = 'none';
                    autoDropTimer = setInterval(() => {
                        if (canDrop && !isGameOver && currentMenu === 'home') { executeDrop(Math.random() * width); }
                    }, 600);
                    showFloatingText(`오토 & 틸트 ON! 🤖📱`, window.innerWidth/2 - 70, window.innerHeight/2);
                } else {
                    btnAuto.classList.remove('active'); document.getElementById('auto-label').innerText = '오토: OFF'; clearInterval(autoDropTimer); updatePreview();
                    if (!isTiltActive) { engine.gravity.x = 0; engine.gravity.y = 1; }
                }
            };

            if (!isAutoDrop && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') { runToggle(); } 
                        else { 
                            showFloatingText(`자이로 권한 필요! 📱`, window.innerWidth/2 - 60, window.innerHeight/2, "#ff7675"); 
                        }
                    }).catch(console.error);
            } else { runToggle(); }
        }

        Events.on(engine, 'collisionStart', (event) => {
            const pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA; const bodyB = pairs[i].bodyB;
                if (bodyA.level !== undefined && bodyB.level !== undefined && bodyA.level === bodyB.level && !bodyA.isMerging && !bodyB.isMerging && bodyA.level < LEVELS.length - 1) {
                    bodyA.isMerging = true; bodyB.isMerging = true; const nextLevel = bodyA.level + 1;
                    
                    if (navigator.vibrate) {
                        if (nextLevel <= 3) { navigator.vibrate(20 + nextLevel * 10); } 
                        else if (nextLevel <= 7) { navigator.vibrate([30, 50, 20 + nextLevel * 10]); } 
                        else { navigator.vibrate([50, 50, 50, 50, 100]); } 
                    }
                    
                    setTimeout(() => {
                        const midX = (bodyA.position.x + bodyB.position.x) / 2; const midY = (bodyA.position.y + bodyB.position.y) / 2;
                        Composite.remove(world, [bodyA, bodyB]);
                        const nextLevelData = LEVELS[nextLevel];
                        const newBody = Bodies.circle(midX, midY, nextLevelData.radius, {
                            restitution: 0.3, render: { sprite: { texture: nextLevelData.img, xScale: nextLevelData.scale, yScale: nextLevelData.scale } }
                        });
                        newBody.level = nextLevel; newBody.isMerging = false; newBody.spawnTime = Date.now(); Composite.add(world, newBody); 
                        
                        triggerBattle();
                    }, 50);
                }
            }
        });
    };
</script>
</body>
</html>
